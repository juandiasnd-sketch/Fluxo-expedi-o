<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo de Expedição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFEFEF;
    --surface: #FFFFFF;
    --surface-2: #F6F6F6;
    --ink: #17181A;
    --ink-soft: #62666B;
    --ink-faint: #96999D;
    --line: #E2E2E2;
    --line-strong: #C7C9CB;

    --brand: #1F7A34;
    --brand-dark: #0E301B;
    --brand-bg: #E9F3EA;

    --c-novo: #7A6A3F;  --c-novo-bg: #F4EEDD;
    --c-sep:  #2E6389;  --c-sep-bg:  #E2EDF3;
    --c-conc: #5C7A34;  --c-conc-bg: #EBF1DE;
    --c-exp:  #FFFFFF;  --c-exp-bg:  #3C9B41;
    --c-alerta:#A3402F; --c-alerta-bg:#F6E3DF;

    --radius: 12px;
    --shadow: 0 1px 2px rgba(23,24,26,0.06), 0 4px 14px rgba(23,24,26,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1520px;margin:0 auto;padding:0 0 60px;}

  /* App header: green gradient brand bar + dark nav */
  .appheader{
    background:linear-gradient(100deg, #3FAE4C 0%, #1B5A2C 55%, #123A1F 100%);
    padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .appheader img{height:34px;display:block;}
  .appheader .userbox{color:#fff;font-family:'Inter';font-size:13px;display:flex;align-items:center;gap:10px;opacity:.95;}

  .appnav{
    background:var(--brand-dark);
    padding:0 28px;
    display:flex;align-items:center;gap:26px;
  }
  .appnav button{
    background:none;border:none;color:rgba(255,255,255,.62);
    font-family:'Inter';font-weight:600;font-size:13.5px;
    padding:13px 2px;cursor:pointer;border-bottom:2px solid transparent;
  }
  .appnav button.active{color:#fff;border-bottom-color:#fff;}

  .pagehead{padding:26px 28px 4px;}
  .pagehead .title{font-family:'Oswald';font-weight:600;font-size:26px;letter-spacing:.01em;color:var(--ink);text-transform:uppercase;}
  .pagehead .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  .toolbar{
    display:flex;align-items:center;justify-content:flex-end;
    gap:10px;flex-wrap:wrap;
    padding:14px 28px 0;
  }

  .btn{
    font-family:'Inter';font-weight:600;font-size:13.5px;
    border-radius:8px;border:1.5px solid var(--brand);
    padding:9px 16px;cursor:pointer;background:var(--brand);color:#fff;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn.danger{background:var(--c-alerta);border-color:var(--c-alerta);}

  .content{padding:18px 28px 0;}

  /* Board */
  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;}
  .column{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    min-width:270px;max-width:270px;display:flex;flex-direction:column;
    max-height:calc(100vh - 240px);
  }
  .column-head{padding:13px 14px 10px;border-bottom:1px solid var(--line);}
  .column-head .bar{height:4px;border-radius:3px;margin-bottom:9px;}
  .column-head .name{font-weight:700;font-size:13.5px;letter-spacing:.01em;}
  .column-head .count{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .column-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
  .column-empty{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:20px 8px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow);}
  .card:hover{border-color:var(--line-strong);}
  .card .dav{font-family:'Oswald';font-weight:600;font-size:14px;}
  .card .cliente{font-size:13px;color:var(--ink);margin-top:2px;font-weight:500;}
  .card .idcli{font-size:11.5px;color:var(--ink-faint);}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink-soft);}
  .tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;}

  /* Table view - spreadsheet style */
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th,td{padding:6px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap;}
  th:last-child, td:last-child{border-right:none;}
  th{background:var(--surface-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:700;position:sticky;top:0;z-index:1;}
  .th-group{text-align:center;font-family:'Oswald';font-weight:700;font-size:12px;letter-spacing:.02em;}
  tr.urgent td.nomecli-cell{background:var(--c-alerta-bg);}
  tr.urgent td.nomecli-cell input{background:transparent;color:var(--c-alerta);font-weight:700;}

  /* inline cell controls */
  td input[type=text]{
    border:1px solid transparent;border-radius:5px;padding:5px 6px;
    font-family:'Inter';font-size:12.5px;color:var(--ink);background:transparent;width:120px;
  }
  td input[type=text]:hover{border-color:var(--line-strong);}
  td input[type=text]:focus{border-color:var(--ink);background:var(--surface);outline:none;}
  td input.tiny{width:52px;text-align:center;}
  td input[type=datetime-local]{
    border:1px solid transparent;border-radius:5px;padding:4px 4px;
    font-family:'Inter';font-size:11.5px;color:var(--ink);background:transparent;width:132px;
  }
  td input[type=datetime-local]:hover{border-color:var(--line-strong);}
  td select{
    border:none;border-radius:6px;padding:5px 8px;font-family:'Inter';font-weight:700;font-size:12px;
    cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center;
  }
  td select.resp-badge{
    width:48px;border-radius:16px;font-weight:700;color:#fff;text-align:center;padding:5px 2px;
  }
  td .checkcell{display:flex;align-items:center;justify-content:center;}
  td .checkcell input{width:16px;height:16px;cursor:pointer;}
  .davcell{position:relative;}
  .note-flag{
    position:absolute;top:2px;right:2px;width:0;height:0;
    border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--c-alerta) transparent transparent;
    cursor:pointer;
  }
  .rowdel{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:4px;}
  .rowdel:hover{color:var(--c-alerta);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(23,34,39,0.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;padding:0;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h2{font-family:'Oswald';font-size:18px;margin:0;}
  .modal-head .x{cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
  .modal-body{padding:20px 22px;}
  .section-label{font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.03em;color:var(--ink-soft);margin:18px 0 10px;}
  .section-label:first-child{margin-top:0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px;}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .field input[type=text], .field input[type=datetime-local], .field select{
    border:1.5px solid var(--line-strong);border-radius:7px;padding:8px 10px;font-family:'Inter';font-size:13.5px;color:var(--ink);background:var(--surface);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .checkfield{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .checkfield input{width:16px;height:16px;}
  .checkfield label{font-size:13px;color:var(--ink);}
  .modal-footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .stage-progress{font-size:12px;color:var(--ink-soft);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .big{font-family:'Oswald';font-size:19px;color:var(--ink);margin-bottom:6px;}

  @media (max-width:720px){
    .grid2{grid-template-columns:1fr;}
    .board{gap:12px;}
    .column{min-width:82vw;max-width:82vw;}
    .docheader .section-labels{display:none;}
  }
</style>
</head>

  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateTime(v){
  if(!v) return '';
  const [datePart, timePart] = v.split('T');
  if(!datePart || !timePart) return v;
  const [y,m,d] = datePart.split('-');
  return `${d}/${m}/${y} ${timePart}`;
}
function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Assina os pedidos em tempo real: qualquer alteração de qualquer pessoa aparece na hora
function subscribePedidos(){
  onSnapshot(pedidosCol, (snapshot) => {
    pedidos = snapshot.docs.map(d => normalizeFromFirestore(d.id, d.data()));
    pedidos.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    render();
  }, (err) => {
    console.error('Erro ao sincronizar com o Firestore', err);
  });
}

// Busca avulsa (usada pelo botão "Atualizar", já que a lista normalmente atualiza sozinha)
async function fetchPedidosOnce(){
  try{
    const snap = await getDocs(pedidosCol);
    pedidos = snap.docs.map(d => normalizeFromFirestore(d.id, d.data()));
    pedidos.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  }catch(e){
    console.error('Erro ao buscar pedidos', e);
  }
  render();
}

function normalizeFromFirestore(id, data){
  const p = blankPedido();
  Object.keys(p).forEach(k => { if(data[k] !== undefined && data[k] !== null) p[k] = String(data[k]); });
  p.id = id;
  return p;
}

async function savePedido(p){
  try{
    await setDoc(doc(db, 'pedidos', p.id), p);
  }catch(e){
    console.error('Erro ao salvar no Firestore', e);
  }
}
async function deletePedido(id){
  try{
    await deleteDoc(doc(db, 'pedidos', id));
  }catch(e){
    console.error('Erro ao excluir no Firestore', e);
  }
}

function blankPedido(){
  return {
    id: uid(), createdAt: new Date().toISOString(), status: DEFAULT_STATUS,
    resp:'', cond:'N', idCli:'', nomeCli:'', dav:'', tipoSep:'', nota:'',
    horaLib:'', horaConcl:'', nNf:'', horaExp:'', transp:'',
  };
}

// Carimba data/hora automaticamente conforme o status muda (aproximação razoável do fluxo real)
function applyStatusStamps(p, newStatus){
  if(newStatus !== 'Aguardando' && !p.horaLib) p.horaLib = nowDateTimeLocal();
  if(['Sep Total','Sep Almox','Faturado','PROGRAMADO'].includes(newStatus) && !p.horaConcl) p.horaConcl = nowDateTimeLocal();
  if(['Enviado','Fat s/Exp'].includes(newStatus) && !p.horaExp) p.horaExp = nowDateTimeLocal();
}

function findPedido(id){ return pedidos.find(p=>p.id===id); }

async function updateField(id, field, value, opts){
  opts = opts || {};
  const p = findPedido(id);
  if(!p) return;
  p[field] = value;
  if(field === 'status') applyStatusStamps(p, value);
  await savePedido(p);
  if(opts.rerender !== false) render();
}

/* ---------- render dispatch ---------- */
function render(){
  document.getElementById('boardView').style.display = view === 'board' ? 'flex' : 'none';
  document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
  document.getElementById('enviadosView').style.display = view === 'enviados' ? 'block' : 'none';
  document.getElementById('btnBoard').classList.toggle('active', view==='board');
  document.getElementById('btnTable').classList.toggle('active', view==='table');
  document.getElementById('btnEnviados').classList.toggle('active', view==='enviados');
  document.getElementById('btnNew').style.display = view === 'enviados' ? 'none' : '';

  if(view === 'board') renderBoard();
  else if(view === 'enviados') renderEnviados();
  else renderTable();

  const today = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('dateBox').textContent = `${pad(today.getDate())}/${pad(today.getMonth()+1)}/${today.getFullYear()}`;

  const pendentes = pedidos.filter(p => p.status !== 'Enviado');
  if(view === 'enviados'){
    const n = pedidos.length - pendentes.length;
    document.getElementById('subMeta').textContent = n ? `${n} pedido${n===1?'':'s'} enviado${n===1?'':'s'} · somente consulta` : 'Nenhum pedido enviado ainda';
  }else{
    document.getElementById('subMeta').textContent =
      pendentes.length ? `${pendentes.length} pedido${pendentes.length===1?'':'s'} no fluxo` : 'Comercial → Almoxarifado / Expedição';
  }
}

/* ---------- board ---------- */
function renderBoard(){
  const el = document.getElementById('boardView');
  const ativos = pedidos.filter(p => p.status !== 'Enviado');
  if(ativos.length === 0){
    el.innerHTML = `<div class="empty-state" style="width:100%;"><div class="big">Nenhum pedido em aberto</div><div>Clique em "+ Novo pedido" para lançar o primeiro.</div></div>`;
    return;
  }
  el.innerHTML = STATUS_OPTIONS.filter(s => s.key !== 'Enviado').map(status => {
    const items = ativos.filter(p => p.status === status.key);
    return `
    <div class="column">
      <div class="column-head">
        <div class="bar" style="background:${status.bg}"></div>
        <div class="name">${status.key}</div>
        <div class="count">${items.length} pedido${items.length===1?'':'s'}</div>
      </div>
      <div class="column-body">
        ${items.length===0 ? '<div class="column-empty">Vazio</div>' : items.map(p => cardHtml(p)).join('')}
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-open]').forEach(c => c.addEventListener('click', () => openModal(c.getAttribute('data-open'))));
}
function cardHtml(p){
  return `
    <div class="card" data-open="${p.id}">
      <div class="dav">${esc(p.dav) || 'Sem nº DAV'}</div>
      <div class="cliente">${esc(p.nomeCli) || 'Cliente não informado'}</div>
      <div class="idcli">${esc(p.idCli)}</div>
      <div class="meta"><span>${esc(p.tipoSep) || '—'}</span><span>${esc(p.resp) || '—'}</span></div>
      ${p.horaExp ? `<div class="meta" style="margin-top:3px;"><span>${fmtDateTime(p.horaExp)}</span></div>` : ''}
    </div>`;
}

/* ---------- table (estilo planilha, edição em linha) ---------- */
function renderTable(){
  const el = document.getElementById('tableView');
  const ativos = pedidos.filter(p => p.status !== 'Enviado');
  if(ativos.length === 0){
    el.innerHTML = `<div class="empty-state"><div class="big">Nenhum pedido em aberto</div><div>Clique em "+ Novo pedido" para lançar o primeiro.</div></div>`;
    return;
  }
  el.innerHTML = `
  <table>
    <thead>
      <tr>
        <th colspan="6" class="th-group" style="background:var(--brand-bg);color:var(--brand);">COMERCIAL</th>
        <th colspan="7" class="th-group" style="background:var(--brand-bg);color:var(--brand);">ALMOXARIFADO / EXPEDIÇÃO</th>
      </tr>
      <tr>
        <th>RESP</th><th>COND</th><th>ID CLI</th><th>NOME CLI</th><th>DAV</th><th>TIPO SEP.</th>
        <th>HORA LIB</th><th>STATUS</th><th>HORA CONCL</th><th>N° NF</th><th>HORA EXP</th><th>TRANSP</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>`;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = ativos.map(p => rowHtml(p)).join('');
  wireRows();
}

function rowHtml(p){
  const st = statusByKey(p.status);
  const respInfo = respByKey(p.resp);
  const respBg = respInfo ? respInfo.bg : '#C7C9CB';
  const condColor = p.cond === 'U' ? '#fff' : '#3F6B45';
  const condBg = p.cond === 'U' ? 'var(--c-alerta)' : '#E1EEE2';
  return `
  <tr data-row="${p.id}" class="${p.cond==='U' ? 'urgent' : ''}">
    <td><select class="resp-badge" style="background:${respBg}" data-id="${p.id}" data-field="resp">
        <option value="" ${!p.resp?'selected':''}>—</option>
        ${RESP_OPTIONS.map(r=>`<option value="${r.key}" ${p.resp===r.key?'selected':''}>${r.key}</option>`).join('')}
      </select></td>
    <td><select data-id="${p.id}" data-field="cond" style="background:${condBg};color:${condColor};">
        <option value="N" ${p.cond!=='U'?'selected':''}>N</option>
        <option value="U" ${p.cond==='U'?'selected':''}>U</option>
      </select></td>
    <td><input type="text" class="tiny" data-id="${p.id}" data-field="idCli" value="${esc(p.idCli)}"></td>
    <td class="nomecli-cell"><input type="text" style="width:150px;" data-id="${p.id}" data-field="nomeCli" value="${esc(p.nomeCli)}"></td>
    <td class="davcell">
      <input type="text" class="tiny" data-id="${p.id}" data-field="dav" value="${esc(p.dav)}">
      ${p.nota ? `<span class="note-flag" title="${esc(p.nota)}" data-note="${p.id}"></span>` : `<span class="note-flag" style="border-color:transparent var(--line-strong) transparent transparent;" title="Adicionar observação" data-note="${p.id}"></span>`}
    </td>
    <td><select data-id="${p.id}" data-field="tipoSep">
        <option value="">—</option>
        ${TIPOS_SEP.map(t=>`<option value="${t}" ${p.tipoSep===t?'selected':''}>${t}</option>`).join('')}
      </select></td>
    <td><input type="datetime-local" data-id="${p.id}" data-field="horaLib" value="${esc(p.horaLib)}"></td>
    <td><select data-id="${p.id}" data-field="status" style="background:${st.bg};color:${st.text};">
        ${STATUS_OPTIONS.map(s=>`<option value="${s.key}" ${p.status===s.key?'selected':''}>${s.key}</option>`).join('')}
      </select></td>
    <td><input type="datetime-local" data-id="${p.id}" data-field="horaConcl" value="${esc(p.horaConcl)}"></td>
    <td><input type="text" class="tiny" data-id="${p.id}" data-field="nNf" value="${esc(p.nNf)}"></td>
    <td><input type="datetime-local" data-id="${p.id}" data-field="horaExp" value="${esc(p.horaExp)}"></td>
    <td><input type="text" list="transpOptions" data-id="${p.id}" data-field="transp" value="${esc(p.transp)}"></td>
    <td><button class="rowdel" data-del="${p.id}" title="Excluir pedido">✕</button></td>
  </tr>`;
}

/* ---------- enviados: somente consulta ---------- */
function renderEnviados(){
  const el = document.getElementById('enviadosView');
  const enviados = pedidos.filter(p => p.status === 'Enviado')
    .sort((a,b) => (b.horaExp||'').localeCompare(a.horaExp||''));
  if(enviados.length === 0){
    el.innerHTML = `<div class="empty-state"><div class="big">Nenhum pedido enviado ainda</div><div>Pedidos aparecem aqui assim que o status vira "Enviado".</div></div>`;
    return;
  }
  el.innerHTML = `
  <table>
    <thead>
      <tr>
        <th colspan="6" class="th-group" style="background:var(--brand-bg);color:var(--brand);">COMERCIAL</th>
        <th colspan="6" class="th-group" style="background:var(--brand-bg);color:var(--brand);">ALMOXARIFADO / EXPEDIÇÃO</th>
      </tr>
      <tr>
        <th>RESP</th><th>COND</th><th>ID CLI</th><th>NOME CLI</th><th>DAV</th><th>TIPO SEP.</th>
        <th>HORA LIB</th><th>HORA CONCL</th><th>N° NF</th><th>HORA EXP</th><th>TRANSP</th><th>OBS</th>
      </tr>
    </thead>
    <tbody>
      ${enviados.map(p => {
        const respInfo = respByKey(p.resp);
        const respBg = respInfo ? respInfo.bg : '#C7C9CB';
        return `
        <tr class="${p.cond==='U' ? 'urgent' : ''}">
          <td><span class="tag" style="background:${respBg};color:#fff;padding:4px 9px;">${esc(p.resp)||'—'}</span></td>
          <td>${esc(p.cond)}</td>
          <td>${esc(p.idCli)}</td>
          <td class="nomecli-cell">${esc(p.nomeCli)}</td>
          <td>${esc(p.dav)}</td>
          <td>${esc(p.tipoSep)}</td>
          <td>${fmtDateTime(p.horaLib)}</td>
          <td>${fmtDateTime(p.horaConcl)}</td>
          <td>${esc(p.nNf)}</td>
          <td>${fmtDateTime(p.horaExp)}</td>
          <td>${esc(p.transp)}</td>
          <td>${esc(p.nota)}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

function wireRows(){
  const tbody = document.getElementById('tbody');

  tbody.querySelectorAll('select[data-field]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      updateField(e.target.getAttribute('data-id'), e.target.getAttribute('data-field'), e.target.value);
    });
  });

  tbody.querySelectorAll('input[type=text], input[type=datetime-local]').forEach(inp => {
    inp.addEventListener('blur', (e) => {
      updateField(e.target.getAttribute('data-id'), e.target.getAttribute('data-field'), e.target.value.trim ? e.target.value.trim() : e.target.value, {rerender:false});
    });
    inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') e.target.blur(); });
  });

  tbody.querySelectorAll('[data-note]').forEach(flag => {
    flag.addEventListener('click', (e) => {
      const id = e.target.getAttribute('data-note');
      const p = findPedido(id);
      const val = prompt('Observação deste pedido:', p.nota || '');
      if(val !== null) updateField(id, 'nota', val.trim());
    });
  });

  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.getAttribute('data-del');
      if(confirm('Excluir este pedido?')){
        await deletePedido(id);
      }
    });
  });
}

/* ---------- modal (usado a partir do Quadro) ---------- */
function openModal(id){
  currentId = id;
  const p = id === 'new' ? blankPedido() : pedidos.find(x => x.id === id);
  if(!p) return;
  document.getElementById('modalTitle').textContent = id === 'new' ? 'Novo pedido' : `Pedido — ${p.dav || p.nomeCli || ''}`;
  document.getElementById('modalBody').innerHTML = formHtml(p);
  document.getElementById('modalFooter').innerHTML = footerHtml(p, id === 'new');
  document.getElementById('overlay').classList.add('open');
  wireFooter(p, id === 'new');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  currentId = null;
}

function formHtml(p){
  return `
  <div class="section-label">Comercial</div>
  <div class="grid2">
    <div class="field"><label>Responsável (RESP)</label>
      <select id="f_resp"><option value="" ${!p.resp?'selected':''}>—</option>${RESP_OPTIONS.map(r=>`<option value="${r.key}" ${p.resp===r.key?'selected':''}>${r.key}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Condição (COND)</label>
      <select id="f_cond"><option value="N" ${p.cond!=='U'?'selected':''}>N — Normal</option><option value="U" ${p.cond==='U'?'selected':''}>U — Urgente</option></select>
    </div>
    <div class="field"><label>ID Cliente</label><input type="text" id="f_idCli" value="${esc(p.idCli)}"></div>
    <div class="field"><label>Nome do cliente</label><input type="text" id="f_nomeCli" value="${esc(p.nomeCli)}"></div>
    <div class="field"><label>DAV / Nº pedido</label><input type="text" id="f_dav" value="${esc(p.dav)}"></div>
    <div class="field"><label>Tipo de separação</label>
      <select id="f_tipoSep"><option value="">Selecione</option>${TIPOS_SEP.map(o=>`<option value="${o}" ${p.tipoSep===o?'selected':''}>${o}</option>`).join('')}</select>
    </div>
  </div>

  <div class="section-label">Almoxarifado / Expedição</div>
  <div class="grid2">
    <div class="field"><label>Status</label>
      <select id="f_status">${STATUS_OPTIONS.map(s=>`<option value="${s.key}" ${p.status===s.key?'selected':''}>${s.key}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Transportadora</label><input type="text" id="f_transp" list="transpOptions" value="${esc(p.transp)}"></div>
    <div class="field"><label>Data/hora liberação</label><input type="datetime-local" id="f_horaLib" value="${esc(p.horaLib)}"></div>
    <div class="field"><label>Data/hora conclusão separação</label><input type="datetime-local" id="f_horaConcl" value="${esc(p.horaConcl)}"></div>
    <div class="field"><label>N° NF</label><input type="text" id="f_nNf" value="${esc(p.nNf)}"></div>
    <div class="field"><label>Data/hora expedição</label><input type="datetime-local" id="f_horaExp" value="${esc(p.horaExp)}"></div>
  </div>
  `;
}

function readForm(base){
  return {
    ...base,
    resp: val('f_resp'), cond: val('f_cond') || 'N', idCli: val('f_idCli'), nomeCli: val('f_nomeCli'),
    dav: val('f_dav'), tipoSep: val('f_tipoSep'), status: val('f_status') || DEFAULT_STATUS,
    horaLib: val('f_horaLib'), horaConcl: val('f_horaConcl'),
    nNf: val('f_nNf'), horaExp: val('f_horaExp'), transp: val('f_transp'),
  };
}
function val(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }

function footerHtml(p, isNew){
  return `
    <div class="stage-progress">Status atual: <strong>${p.status || DEFAULT_STATUS}</strong></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${!isNew ? `<button class="btn danger" id="btnDelete">Excluir</button>` : ''}
      <button class="btn" id="btnSave">${isNew ? 'Criar pedido' : 'Salvar'}</button>
    </div>
  `;
}

function wireFooter(p, isNew){
  const save = document.getElementById('btnSave');
  if(save) save.addEventListener('click', async () => {
    const updated = readForm(p);
    if(updated.status !== p.status) applyStatusStamps(updated, updated.status);
    await savePedido(updated);
    closeModal();
  });
  const del = document.getElementById('btnDelete');
  if(del) del.addEventListener('click', async () => {
    if(confirm('Excluir este pedido?')){
      await deletePedido(p.id);
      closeModal();
    }
  });
}

/* ---------- novo pedido: direto na tabela quando em modo Tabela ---------- */
async function newPedido(){
  if(view === 'table'){
    const p = blankPedido();
    pedidos.unshift(p);
    await savePedido(p);
    renderTable();
    const firstInput = document.querySelector(`tr[data-row="${p.id}"] input[data-field="idCli"]`);
    if(firstInput) firstInput.focus();
  }else{
    openModal('new');
  }
}

/* ---------- wire up top-level UI ---------- */
document.getElementById('btnNew').addEventListener('click', newPedido);
document.getElementById('btnClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });
document.getElementById('btnBoard').addEventListener('click', () => { view='board'; render(); });
document.getElementById('btnTable').addEventListener('click', () => { view='table'; render(); });
document.getElementById('btnEnviados').addEventListener('click', () => { view='enviados'; render(); });
document.getElementById('btnRefresh').addEventListener('click', fetchPedidosOnce);

document.getElementById('transpOptions').innerHTML = TRANSP_LIST.map(t => `<option value="${esc(t)}">`).join('');

subscribePedidos();
</script>
</body>
</html>
